name: build-game-hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Compile Pong (web)
        run: |
          mkdir -p dist/web
          emcc core/pong.c platform_web/main.c \
            -I core \
            -s USE_SDL=2 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -o dist/web/index.html

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: game-hub-web
          path: dist/web

  build-nds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Pong (DS, networked)
        shell: bash
        run: |
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$PATH"
          mkdir -p build/nds
          arm-none-eabi-gcc -c platform_nds_net/main.c -I core \
            -I/opt/devkitpro/libnds/include -DARM9 -o build/nds/main.o \
            -mthumb -mthumb-interwork -O2
          arm-none-eabi-gcc build/nds/main.o \
            -specs=ds_arm9.specs -L/opt/devkitpro/libnds/lib -ldswifi9 -lnds9 \
            -o build/nds/game-hub.elf
          arm-none-eabi-objcopy -O binary build/nds/game-hub.elf build/nds/game-hub.bin
          ndstool -c dist_gamehub.nds -9 build/nds/game-hub.bin -b icon.bmp "Game Hub;Pong Net;v0.1"
        continue-on-error: true

      - name: Upload NDS build
        uses: actions/upload-artifact@v4
        with:
          name: game-hub-nds
          path: dist_gamehub.nds
